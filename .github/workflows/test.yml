name: SonarQube Scan (Ephemeral)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  sonarqube:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: sonar
          POSTGRES_PASSWORD: sonarpass
          POSTGRES_DB: sonarqube
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sonar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      sonarqube:
        image: sonarqube:community
        env:
          SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
          SONAR_JDBC_USERNAME: sonar
          SONAR_JDBC_PASSWORD: sonarpass
        ports:
          - 9000:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Wait for SonarQube to be ready
        run: |
          echo "⏳ Waiting for SonarQube to start..."
          for i in {1..40}; do
            STATUS=$(curl -s http://localhost:9000/api/system/status | jq -r .status || true)
            if [ "$STATUS" = "UP" ]; then
              echo "✅ SonarQube is UP!"
              break
            fi
            echo "Current status: $STATUS (try $i)"
            sleep 5
          done

      - name: Generate SonarQube admin token
        run: |
          echo "🔑 Creating admin token..."
          curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=ci_token" > token.json
          export SONAR_TOKEN=$(jq -r .token token.json)
          if [ "$SONAR_TOKEN" = "null" ]; then
            echo "Failed to generate token!"
            exit 1
          fi
          echo "SONAR_TOKEN=$SONAR_TOKEN" >> $GITHUB_ENV

      - name: Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Run SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: http://sonarqube:9000   # 👈 FIXED: use container hostname
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=my-project
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8
