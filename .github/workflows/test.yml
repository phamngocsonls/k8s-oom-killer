name: SonarQube Scan (Ephemeral)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  sonarqube:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: sonar
          POSTGRES_PASSWORD: sonarpass
          POSTGRES_DB: sonarqube
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sonar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      sonarqube:
        image: sonarqube:community
        env:
          SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
          SONAR_JDBC_USERNAME: sonar
          SONAR_JDBC_PASSWORD: sonarpass
        ports:
          - 9000:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Wait for SonarQube to be ready
        run: |
          echo "⏳ Waiting for SonarQube to start..."
          for i in {1..40}; do
            STATUS=$(curl -s http://localhost:9000/api/system/status | jq -r .status || true)
            if [ "$STATUS" = "UP" ]; then
              echo "✅ SonarQube is UP!"
              break
            fi
            echo "Current status: $STATUS (try $i)"
            sleep 5
          done

      - name: Generate SonarQube admin token
        run: |
          echo "🔑 Creating admin token..."
          curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=ci_token" > token.json
          export SONAR_TOKEN=$(jq -r .token token.json)
          if [ "$SONAR_TOKEN" = "null" ]; then
            echo "Failed to generate token!"
            exit 1
          fi
          echo "SONAR_TOKEN=$SONAR_TOKEN" >> $GITHUB_ENV

      - name: Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Run SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: http://sonarqube:9000   # 👈 FIXED: use container hostname
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=my-project
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8

      - name: Show Analysis Results (Alternative)
        run: |
          echo "📊 SonarQube Analysis Complete!"
          echo "================================"
          echo "✅ Analysis successful"
          echo "🔗 Dashboard: http://sonarqube:9000/dashboard?id=my-project"
          echo ""
          echo "⏳ Waiting for server processing..."
          sleep 10
      
          echo "📈 Quick Summary:"
          
          # Try different project identifiers
          for PROJECT_ID in "my-project" "my_project" "myproject"; do
            echo "Trying project key: $PROJECT_ID"
            
            QG_STATUS=$(curl -s "http://sonarqube:9000/api/qualitygates/project_status?projectKey=$PROJECT_ID" | jq -r '.projectStatus.status // "NOT_FOUND"')
            if [ "$QG_STATUS" != "NOT_FOUND" ]; then
              echo "✅ Found project with key: $PROJECT_ID"
              echo "Quality Gate: $QG_STATUS"
              
              ISSUES_COUNT=$(curl -s "http://sonarqube:9000/api/issues/search?componentKeys=$PROJECT_ID&resolved=false" | jq -r '.total // "N/A"')
              echo "Total Issues: $ISSUES_COUNT"
              
              COVERAGE=$(curl -s "http://sonarqube:9000/api/measures/component?component=$PROJECT_ID&metricKeys=coverage" | jq -r '.component.measures[]?.value // "N/A"')
              echo "Coverage: ${COVERAGE}%"
              break
            fi
          done
          
          echo "================================"
